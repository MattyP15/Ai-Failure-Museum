<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Failure Museum</title>

    <link rel="stylesheet" type="text/css" href={% static "css/style.css" %}>

    <!-- Very awesome font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="app">
        <header class="appHeader">
            <div class="points">
                ⭐ <span>0 Points</span>
            </div>

            <a href = "/login">
            <button class="loginBtn">
                Log In
            </button>
            </a>
        </header>


        <section class="title">
            <h1>AI Failure Museum</h1>

            <p>
                Im not writing whatever she put here so just imagine some cool description about the AI Failure Museum that makes you want to explore more.
            </p>
        </section>

        <div class="sortBar">
            <label for="category-filter" class="sortBtn">
                ☰
            </label>
        </div>


        <section class="categoryGrid">
            <!-- Loop through all data -->
            <a href="/category" class="categoryLink">
                <article class="categoryCards" style="--accent-color: {{ cat.color }};">
                    <div class="cardText">
                        <h3>PlaceHolderTitle</h3>
                        <p>PlaceHolderDescription</p>
                    </div>
                    <div class="icon">🎉</div>
                </article>
            </a>
            <!-- Loop through end -->
        </section>
    </main>
</body>
</html>
