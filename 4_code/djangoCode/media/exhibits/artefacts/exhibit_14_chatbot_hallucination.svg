<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="450" fill="#f0f2f5" rx="8"/>
  <!-- Browser chrome -->
  <rect x="0" y="0" width="800" height="35" fill="#dee2e6" rx="8"/>
  <circle cx="20" cy="17" r="6" fill="#ff6b6b"/><circle cx="40" cy="17" r="6" fill="#ffd43b"/><circle cx="60" cy="17" r="6" fill="#51cf66"/>
  <rect x="100" y="7" width="400" height="21" fill="white" rx="4"/>
  <text x="120" y="22" fill="#95a5a6" font-size="10">council.gov.uk/planning-assistant</text>
  <!-- Chat interface -->
  <rect x="50" y="50" width="700" height="380" fill="white" rx="8" stroke="#ddd"/>
  <rect x="50" y="50" width="700" height="45" fill="#2980b9" rx="8"/>
  <rect x="50" y="75" width="700" height="20" fill="#2980b9"/>
  <text x="400" y="78" fill="white" font-size="14" text-anchor="middle" font-weight="bold">Borough Council Planning Assistant</text>
  <circle cx="80" cy="72" r="14" fill="white" opacity="0.3"/>
  <text x="80" y="77" fill="white" font-size="14" text-anchor="middle">🏛</text>
  <!-- User message -->
  <rect x="300" y="110" width="420" height="50" fill="#e3f2fd" rx="12"/>
  <text x="510" y="130" fill="#1a1a2e" font-size="11" text-anchor="middle">Do I need planning permission to convert my</text>
  <text x="510" y="146" fill="#1a1a2e" font-size="11" text-anchor="middle">retail unit to a cafe? It's under 150 sqm.</text>
  <!-- Bot response -->
  <rect x="80" y="175" width="470" height="140" fill="#f8f9fa" rx="12" stroke="#e0e0e0"/>
  <circle cx="100" cy="195" r="12" fill="#2980b9"/><text x="100" y="199" fill="white" font-size="10" text-anchor="middle">AI</text>
  <text x="120" y="200" fill="#1a1a2e" font-size="11" font-weight="bold">Planning Assistant</text>
  <text x="120" y="222" fill="#1a1a2e" font-size="10">Under the General Permitted Development Order</text>
  <text x="120" y="238" fill="#1a1a2e" font-size="10">(Class E), conversion from retail to cafe use</text>
  <text x="120" y="254" fill="#1a1a2e" font-size="10"><tspan font-weight="bold" fill="#e74c3c">does not require planning permission</tspan>, provided</text>
  <text x="120" y="270" fill="#1a1a2e" font-size="10">the property is under <tspan font-weight="bold" fill="#e74c3c">150 square metres</tspan> and has</text>
  <text x="120" y="286" fill="#1a1a2e" font-size="10">been in retail use for at least <tspan font-weight="bold" fill="#e74c3c">two years</tspan>.</text>
  <text x="120" y="306" fill="#27ae60" font-size="10">✓ Your property meets both conditions.</text>
  <!-- Annotation: FABRICATED -->
  <rect x="560" y="230" width="170" height="80" fill="#e74c3c" opacity="0.1" rx="6" stroke="#e74c3c" stroke-width="2"/>
  <text x="645" y="250" fill="#e74c3c" font-size="10" text-anchor="middle" font-weight="bold">⚠ HALLUCINATED</text>
  <text x="645" y="268" fill="#e74c3c" font-size="9" text-anchor="middle">"150 sqm" — fabricated</text>
  <text x="645" y="282" fill="#e74c3c" font-size="9" text-anchor="middle">"two years" — fabricated</text>
  <text x="645" y="296" fill="#e74c3c" font-size="9" text-anchor="middle">Local exception: MISSED</text>
  <!-- Impact box -->
  <rect x="80" y="340" width="620" height="70" fill="#e74c3c" opacity="0.08" rx="6" stroke="#e74c3c"/>
  <text x="390" y="360" fill="#e74c3c" font-size="12" text-anchor="middle" font-weight="bold">Impact: Priya spent £28,000 on renovations based on this advice</text>
  <text x="390" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">Enforcement officer halted work — retrospective application required</text>
  <text x="390" y="396" fill="#1a1a2e" font-size="10" text-anchor="middle">Additional £9,000 in lost rent and contractor fees  |  No disclaimer shown</text>
</svg>