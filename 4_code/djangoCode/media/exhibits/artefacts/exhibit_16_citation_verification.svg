<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="420" fill="#f8f9fa" rx="8"/>
  <text x="400" y="28" fill="#1a1a2e" font-size="16" text-anchor="middle" font-weight="bold">Citation Audit — AI-Generated Environmental Impact Report</text>
  <text x="400" y="46" fill="#95a5a6" font-size="11" text-anchor="middle">34 citations checked against Google Scholar and DOI databases</text>
  <!-- Summary stats -->
  <rect x="50" y="60" width="200" height="70" fill="#27ae60" opacity="0.1" rx="6" stroke="#27ae60"/>
  <text x="150" y="82" fill="#27ae60" font-size="22" text-anchor="middle" font-weight="bold">23</text>
  <text x="150" y="100" fill="#27ae60" font-size="11" text-anchor="middle">Real citations (68%)</text>
  <text x="150" y="118" fill="#95a5a6" font-size="9" text-anchor="middle">But some misrepresented findings</text>
  <rect x="300" y="60" width="200" height="70" fill="#e74c3c" opacity="0.1" rx="6" stroke="#e74c3c"/>
  <text x="400" y="82" fill="#e74c3c" font-size="22" text-anchor="middle" font-weight="bold">11</text>
  <text x="400" y="100" fill="#e74c3c" font-size="11" text-anchor="middle">Fabricated citations (32%)</text>
  <text x="400" y="118" fill="#e74c3c" font-size="9" text-anchor="middle">Papers that do not exist</text>
  <rect x="550" y="60" width="200" height="70" fill="#f39c12" opacity="0.1" rx="6" stroke="#f39c12"/>
  <text x="650" y="82" fill="#f39c12" font-size="22" text-anchor="middle" font-weight="bold">2</text>
  <text x="650" y="100" fill="#f39c12" font-size="11" text-anchor="middle">Critical fabrications</text>
  <text x="650" y="118" fill="#f39c12" font-size="9" text-anchor="middle">Supporting "negligible impact" claim</text>
  <!-- Citation list -->
  <rect x="50" y="145" width="700" height="240" fill="white" rx="6" stroke="#ddd"/>
  <text x="70" y="170" fill="#1a1a2e" font-size="11" font-weight="bold">Sample from citation audit:</text>
  <!-- Real citation -->
  <rect x="65" y="180" width="15" height="15" fill="#27ae60" rx="2"/>
  <text x="72" y="192" fill="white" font-size="10" text-anchor="middle">✓</text>
  <text x="90" y="192" fill="#1a1a2e" font-size="10">Smith, J. et al. (2019) "Wetland biodiversity indicators for UK SSSIs" — <tspan fill="#27ae60">VERIFIED: exists in Ecological Indicators</tspan></text>
  <!-- Real but misrepresented -->
  <rect x="65" y="205" width="15" height="15" fill="#f39c12" rx="2"/>
  <text x="72" y="217" fill="white" font-size="10" text-anchor="middle">~</text>
  <text x="90" y="217" fill="#1a1a2e" font-size="10">Chen, L. (2020) "Water table dynamics in peatland systems" — <tspan fill="#f39c12">EXISTS but findings misrepresented</tspan></text>
  <!-- Fake citation 1 -->
  <rect x="65" y="230" width="15" height="15" fill="#e74c3c" rx="2"/>
  <text x="72" y="242" fill="white" font-size="10" text-anchor="middle">✗</text>
  <text x="90" y="242" fill="#1a1a2e" font-size="10">Williams, R. et al. (2021) "Minimal hydrological impact of edge development" — <tspan fill="#e74c3c" font-weight="bold">DOES NOT EXIST</tspan></text>
  <!-- Fake citation 2 -->
  <rect x="65" y="255" width="15" height="15" fill="#e74c3c" rx="2"/>
  <text x="72" y="267" fill="white" font-size="10" text-anchor="middle">✗</text>
  <text x="90" y="267" fill="#1a1a2e" font-size="10">Patel, A. &amp; Jones, M. (2022) "Negligible runoff effects near protected wetlands" — <tspan fill="#e74c3c" font-weight="bold">DOES NOT EXIST</tspan></text>
  <!-- Fake citation 3 -->
  <rect x="65" y="280" width="15" height="15" fill="#e74c3c" rx="2"/>
  <text x="72" y="292" fill="white" font-size="10" text-anchor="middle">✗</text>
  <text x="90" y="292" fill="#1a1a2e" font-size="10">Thompson, K. (2020) "Buffering capacity of semi-natural grasslands" — <tspan fill="#e74c3c" font-weight="bold">DOES NOT EXIST</tspan></text>
  <!-- Note about format -->
  <rect x="65" y="310" width="670" height="60" fill="#e74c3c" opacity="0.05" rx="4"/>
  <text x="400" y="330" fill="#e74c3c" font-size="10" text-anchor="middle" font-weight="bold">All fabricated citations had: real author names, real journal titles, plausible dates</text>
  <text x="400" y="348" fill="#e74c3c" font-size="10" text-anchor="middle">Perfect formatting made them indistinguishable from real references without database verification</text>
  <text x="400" y="363" fill="#95a5a6" font-size="9" text-anchor="middle">The 2 most critical fabrications supported the report's central claim: "negligible impact on adjacent wetland"</text>
  <!-- Impact -->
  <rect x="50" y="395" width="700" height="20" fill="#e74c3c" opacity="0.08" rx="3"/>
  <text x="400" y="409" fill="#e74c3c" font-size="10" text-anchor="middle">Planning suspended | 6-month delay | £180,000 additional costs | Formal complaint to professional body</text>
</svg>