<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="420" fill="#f8f9fa" rx="8"/>
  <text x="400" y="28" fill="#1a1a2e" font-size="16" text-anchor="middle" font-weight="bold">"Anomalous Behaviour" Flagging Rate — Neurodivergent vs. Neurotypical Students</text>
  <text x="400" y="46" fill="#95a5a6" font-size="11" text-anchor="middle">First 3 months of behavioural analytics deployment across 3 schools</text>
  <!-- Main comparison -->
  <rect x="80" y="70" width="280" height="200" fill="white" rx="8" stroke="#27ae60" stroke-width="2"/>
  <text x="220" y="95" fill="#27ae60" font-size="13" text-anchor="middle" font-weight="bold">Neurotypical Students</text>
  <text x="220" y="150" fill="#27ae60" font-size="48" text-anchor="middle" font-weight="bold">3.2</text>
  <text x="220" y="175" fill="#1a1a2e" font-size="12" text-anchor="middle">flags per student (avg)</text>
  <text x="220" y="195" fill="#95a5a6" font-size="10" text-anchor="middle">over 3 months</text>
  <text x="220" y="220" fill="#27ae60" font-size="10" text-anchor="middle">Baseline established from majority behaviour</text>
  <text x="220" y="255" fill="#1a1a2e" font-size="11" text-anchor="middle">Total flags: 547</text>
  <rect x="440" y="70" width="280" height="200" fill="white" rx="8" stroke="#e74c3c" stroke-width="2"/>
  <text x="580" y="95" fill="#e74c3c" font-size="13" text-anchor="middle" font-weight="bold">Neurodivergent Students</text>
  <text x="580" y="150" fill="#e74c3c" font-size="48" text-anchor="middle" font-weight="bold">15.0</text>
  <text x="580" y="175" fill="#1a1a2e" font-size="12" text-anchor="middle">flags per student (avg)</text>
  <text x="580" y="195" fill="#95a5a6" font-size="10" text-anchor="middle">over 3 months</text>
  <text x="580" y="220" fill="#e74c3c" font-size="10" text-anchor="middle">ASD, ADHD, anxiety, Tourette's</text>
  <text x="580" y="255" fill="#1a1a2e" font-size="11" text-anchor="middle">Total flags: 300 (from fewer students)</text>
  <!-- 4.7x -->
  <rect x="360" y="135" width="80" height="40" fill="#e74c3c" rx="20"/>
  <text x="400" y="161" fill="white" font-size="16" text-anchor="middle" font-weight="bold">4.7x</text>
  <!-- Flagged behaviours -->
  <rect x="80" y="290" width="640" height="90" fill="white" rx="6" stroke="#ddd"/>
  <text x="400" y="312" fill="#1a1a2e" font-size="12" text-anchor="middle" font-weight="bold">Behaviours flagged as "anomalous" (actually normal neurodivergent behaviour):</text>
  <text x="120" y="335" fill="#e74c3c" font-size="10">• Avoiding eye contact with camera (autism — natural gaze pattern)</text>
  <text x="120" y="352" fill="#e74c3c" font-size="10">• Taking unusual routes (sensory preferences)     • Repetitive movements near sensors (stimming)</text>
  <text x="120" y="369" fill="#e74c3c" font-size="10">• "Evasive" or "distressed" facial expressions (neurotypical emotional labels imposed on neurodivergent behaviour)</text>
  <!-- Impact -->
  <rect x="80" y="390" width="640" height="25" fill="#e74c3c" opacity="0.08" rx="3"/>
  <text x="400" y="407" fill="#e74c3c" font-size="10" text-anchor="middle">1 student flagged 23 times in one month for "evasive gaze"  |  1 student's attendance dropped from 94% to 67%</text>
</svg>