<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="450" fill="#1a1a2e" rx="8"/>
  <text x="400" y="28" fill="#aaa" font-size="14" text-anchor="middle">Plant Safety Monitoring — Chlorine Handling Unit — 08:42 AM</text>
  <!-- Sensor 1: Temperature -->
  <rect x="20" y="50" width="240" height="170" fill="#16213e" rx="6"/>
  <text x="140" y="75" fill="#aaa" font-size="11" text-anchor="middle">PIPE TEMPERATURE</text>
  <text x="140" y="130" fill="#f39c12" font-size="36" text-anchor="middle" font-weight="bold">67.2°C</text>
  <rect x="40" y="150" width="200" height="8" fill="#2c3e50" rx="4"/>
  <rect x="40" y="150" width="168" height="8" fill="#f39c12" rx="4"/>
  <text x="40" y="175" fill="#666" font-size="9">Normal: 50-65°C</text>
  <text x="220" y="175" fill="#f39c12" font-size="9" text-anchor="end">Limit: 80°C</text>
  <text x="140" y="200" fill="#f39c12" font-size="10" text-anchor="middle">ELEVATED — within range</text>
  <!-- Sensor 2: Flow Rate -->
  <rect x="280" y="50" width="240" height="170" fill="#16213e" rx="6"/>
  <text x="400" y="75" fill="#aaa" font-size="11" text-anchor="middle">ADJACENT LINE FLOW</text>
  <text x="400" y="130" fill="#f39c12" font-size="36" text-anchor="middle" font-weight="bold">14.8 L/m</text>
  <rect x="300" y="150" width="200" height="8" fill="#2c3e50" rx="4"/>
  <rect x="300" y="150" width="164" height="8" fill="#f39c12" rx="4"/>
  <text x="300" y="175" fill="#666" font-size="9">Normal: 10-14 L/m</text>
  <text x="480" y="175" fill="#f39c12" font-size="9" text-anchor="end">Limit: 18 L/m</text>
  <text x="400" y="200" fill="#f39c12" font-size="10" text-anchor="middle">ELEVATED — within range</text>
  <!-- Sensor 3: Chlorine Concentration -->
  <rect x="540" y="50" width="240" height="170" fill="#16213e" rx="6"/>
  <text x="660" y="75" fill="#aaa" font-size="11" text-anchor="middle">CHLORINE GAS (PPM)</text>
  <text x="660" y="130" fill="#f39c12" font-size="36" text-anchor="middle" font-weight="bold">0.42</text>
  <rect x="560" y="150" width="200" height="8" fill="#2c3e50" rx="4"/>
  <rect x="560" y="150" width="168" height="8" fill="#f39c12" rx="4"/>
  <text x="560" y="175" fill="#666" font-size="9">Normal: 0.0-0.3 ppm</text>
  <text x="740" y="175" fill="#e74c3c" font-size="9" text-anchor="end">Alarm: 0.5 ppm</text>
  <text x="660" y="200" fill="#f39c12" font-size="10" text-anchor="middle">ELEVATED — below alarm</text>
  <!-- Overall status -->
  <rect x="20" y="240" width="760" height="60" fill="#16213e" rx="6"/>
  <text x="400" y="267" fill="#27ae60" font-size="18" text-anchor="middle" font-weight="bold">SYSTEM STATUS: NORMAL</text>
  <text x="400" y="288" fill="#aaa" font-size="12" text-anchor="middle">AI Confidence: 78%  |  No anomaly detected  |  No alert triggered</text>
  <!-- The problem box -->
  <rect x="20" y="320" width="760" height="115" fill="#e74c3c" opacity="0.08" rx="6" stroke="#e74c3c" stroke-width="2"/>
  <text x="400" y="345" fill="#e74c3c" font-size="14" text-anchor="middle" font-weight="bold">⚠ WHAT THE AI MISSED</text>
  <text x="40" y="370" fill="white" font-size="11">• All three sensors simultaneously near their upper bounds — a combination never seen in training data</text>
  <text x="40" y="390" fill="white" font-size="11">• 78% confidence (vs usual 95%+) was logged but did not trigger any alert or human check</text>
  <text x="40" y="410" fill="white" font-size="11">• Valve seal failed 2 hours later → 15kg chlorine leak → 12 workers evacuated, 3 treated for exposure</text>
  <text x="40" y="428" fill="#f39c12" font-size="10">Detected by: human operator who smelled chlorine during a routine walkthrough</text>
</svg>