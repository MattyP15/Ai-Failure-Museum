<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="580" fill="#f0f2f5" rx="8"/>
  <!-- Phone frame -->
  <rect x="200" y="10" width="400" height="560" fill="#1a1a2e" rx="30"/>
  <rect x="210" y="45" width="380" height="510" fill="white" rx="4"/>
  <!-- Notch -->
  <rect x="330" y="15" width="140" height="22" fill="#111" rx="11"/>
  <!-- Header -->
  <rect x="210" y="45" width="380" height="55" fill="#2980b9" rx="4"/>
  <rect x="210" y="80" width="380" height="20" fill="#2980b9"/>
  <circle cx="245" cy="72" r="16" fill="white" opacity="0.2"/>
  <text x="245" y="77" fill="white" font-size="16" text-anchor="middle">&#x1f3e5;</text>
  <text x="275" y="70" fill="white" font-size="13" font-weight="bold">NHS 111 Triage Assistant</text>
  <text x="275" y="86" fill="white" font-size="9" opacity="0.8">Online · AI-powered</text>
  <circle cx="560" cy="72" r="4" fill="#27ae60"/>

  <!-- Bot message 1 -->
  <rect x="225" y="110" width="260" height="35" fill="#e8f4fd" rx="12"/>
  <text x="235" y="132" fill="#1a1a2e" font-size="10">How can I help you today?</text>

  <!-- User message 1 -->
  <rect x="350" y="155" width="225" height="45" fill="#dcf8c6" rx="12"/>
  <text x="360" y="173" fill="#1a1a2e" font-size="10">I've had a tight feeling in my chest for</text>
  <text x="360" y="188" fill="#1a1a2e" font-size="10">about 2 hours and I feel really breathless</text>

  <!-- Bot message 2 -->
  <rect x="225" y="210" width="280" height="35" fill="#e8f4fd" rx="12"/>
  <text x="235" y="232" fill="#1a1a2e" font-size="10">I understand. Can I ask your age please?</text>

  <!-- User message 2 -->
  <rect x="470" y="255" width="105" height="28" fill="#dcf8c6" rx="12"/>
  <text x="480" y="273" fill="#1a1a2e" font-size="10">I'm 36 years old</text>

  <!-- Bot message 3: the dangerous one -->
  <rect x="225" y="293" width="310" height="100" fill="#e8f4fd" rx="12"/>
  <text x="235" y="313" fill="#1a1a2e" font-size="10">Based on your age and symptoms, your risk</text>
  <text x="235" y="328" fill="#1a1a2e" font-size="10">assessment is <tspan fill="#27ae60" font-weight="bold">LOW</tspan>.</text>
  <text x="235" y="350" fill="#1a1a2e" font-size="10" font-weight="bold">Recommendation: Monitor at home.</text>
  <text x="235" y="367" fill="#1a1a2e" font-size="10">If symptoms persist, contact your GP</text>
  <text x="235" y="382" fill="#1a1a2e" font-size="10">within 48 hours.</text>

  <!-- User message 3 -->
  <rect x="310" y="403" width="265" height="45" fill="#dcf8c6" rx="12"/>
  <text x="320" y="421" fill="#1a1a2e" font-size="10">Are you sure? It really doesn't feel right,</text>
  <text x="320" y="436" fill="#1a1a2e" font-size="10">I've never felt like this before</text>

  <!-- Bot message 4: doubling down -->
  <rect x="225" y="458" width="310" height="50" fill="#e8f4fd" rx="12"/>
  <text x="235" y="478" fill="#1a1a2e" font-size="10">Chest tightness in your age group is most</text>
  <text x="235" y="493" fill="#1a1a2e" font-size="10">commonly associated with anxiety or muscle strain.</text>

  <!-- Timestamp -->
  <text x="400" y="525" fill="#999" font-size="8" text-anchor="middle">14:23 — Patient waited 9 more hours before partner called 999</text>

  <!-- Left annotations -->
  <rect x="10" y="255" width="180" height="50" fill="#e74c3c" opacity="0.1" rx="6" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="100" y="275" fill="#e74c3c" font-size="9" text-anchor="middle" font-weight="bold">AGE = 36</text>
  <text x="100" y="290" fill="#e74c3c" font-size="8" text-anchor="middle">Risk score reduced 40-60%</text>
  <line x1="190" y1="269" x2="225" y2="269" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3"/>

  <rect x="10" y="155" width="180" height="50" fill="#e74c3c" opacity="0.1" rx="6" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="100" y="172" fill="#e74c3c" font-size="9" text-anchor="middle" font-weight="bold">"TIGHT" not "CRUSHING"</text>
  <text x="100" y="187" fill="#e74c3c" font-size="8" text-anchor="middle">Informal language penalised</text>
  <line x1="190" y1="178" x2="225" y2="178" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3"/>

  <!-- Right annotations -->
  <rect x="610" y="293" width="180" height="75" fill="#e74c3c" opacity="0.1" rx="6" stroke="#e74c3c" stroke-width="2"/>
  <text x="700" y="313" fill="#e74c3c" font-size="9" text-anchor="middle" font-weight="bold">DANGEROUS OUTPUT</text>
  <text x="700" y="328" fill="#e74c3c" font-size="8" text-anchor="middle">Confidence was below 60%</text>
  <text x="700" y="341" fill="#e74c3c" font-size="8" text-anchor="middle">but system defaulted to</text>
  <text x="700" y="354" fill="#e74c3c" font-size="8" text-anchor="middle" font-weight="bold">LOW RISK instead of</text>
  <text x="700" y="367" fill="#e74c3c" font-size="8" text-anchor="middle" font-weight="bold">escalating to a human</text>
  <line x1="610" y1="340" x2="535" y2="340" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3"/>

  <rect x="610" y="403" width="180" height="55" fill="#e74c3c" opacity="0.1" rx="6" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="700" y="420" fill="#e74c3c" font-size="9" text-anchor="middle" font-weight="bold">PATIENT'S INSTINCT</text>
  <text x="700" y="433" fill="#e74c3c" font-size="8" text-anchor="middle">Was correct — confirmed</text>
  <text x="700" y="446" fill="#e74c3c" font-size="8" text-anchor="middle">acute cardiac event at A&amp;E</text>
  <line x1="610" y1="430" x2="575" y2="425" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3"/>

  <!-- Bottom bar -->
  <rect x="100" y="548" width="600" height="25" fill="#e74c3c" opacity="0.1" rx="4"/>
  <text x="400" y="565" fill="#e74c3c" font-size="10" text-anchor="middle" font-weight="bold">23 similar cases over 6 months — 8 confirmed cardiac events — caught by audit, not the chatbot</text>
</svg>
