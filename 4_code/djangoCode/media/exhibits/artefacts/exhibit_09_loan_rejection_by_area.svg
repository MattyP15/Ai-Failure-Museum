<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="420" fill="#f8f9fa" rx="8"/>
  <text x="400" y="28" fill="#1a1a2e" font-size="16" text-anchor="middle" font-weight="bold">Loan Rejection Rate — Paired Test Applications (Identical Financial Profiles)</text>
  <text x="400" y="46" fill="#95a5a6" font-size="11" text-anchor="middle">Same income, credit score, employment history, debt levels — different postcodes</text>
  <!-- axes -->
  <line x1="120" y1="70" x2="120" y2="330" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="120" y1="330" x2="700" y2="330" stroke="#1a1a2e" stroke-width="2"/>
  <text x="110" y="334" fill="#1a1a2e" font-size="10" text-anchor="end">0%</text>
  <text x="110" y="269" fill="#1a1a2e" font-size="10" text-anchor="end">25%</text>
  <text x="110" y="204" fill="#1a1a2e" font-size="10" text-anchor="end">50%</text>
  <text x="110" y="139" fill="#1a1a2e" font-size="10" text-anchor="end">75%</text>
  <text x="110" y="74" fill="#1a1a2e" font-size="10" text-anchor="end">100%</text>
  <line x1="120" y1="265" x2="700" y2="265" stroke="#eee"/><line x1="120" y1="200" x2="700" y2="200" stroke="#eee"/>
  <line x1="120" y1="135" x2="700" y2="135" stroke="#eee"/><line x1="120" y1="70" x2="700" y2="70" stroke="#eee"/>
  <!-- Bars: Affluent=22%, Mixed=31%, Disadvantaged=41% -->
  <!-- y = 330 - (val/100)*260 -->
  <rect x="180" y="273" width="120" height="57" fill="#27ae60" rx="4" opacity="0.8"/>
  <text x="240" y="263" fill="#27ae60" font-size="14" text-anchor="middle" font-weight="bold">22%</text>
  <text x="240" y="348" fill="#1a1a2e" font-size="11" text-anchor="middle">Affluent area</text>
  <text x="240" y="362" fill="#95a5a6" font-size="9" text-anchor="middle">(predominantly white)</text>
  <rect x="350" y="249" width="120" height="81" fill="#f39c12" rx="4" opacity="0.8"/>
  <text x="410" y="239" fill="#f39c12" font-size="14" text-anchor="middle" font-weight="bold">31%</text>
  <text x="410" y="348" fill="#1a1a2e" font-size="11" text-anchor="middle">Mixed area</text>
  <rect x="520" y="224" width="120" height="106" fill="#e74c3c" rx="4" opacity="0.8"/>
  <text x="580" y="214" fill="#e74c3c" font-size="14" text-anchor="middle" font-weight="bold">41%</text>
  <text x="580" y="348" fill="#1a1a2e" font-size="11" text-anchor="middle">Disadvantaged area</text>
  <text x="580" y="362" fill="#95a5a6" font-size="9" text-anchor="middle">(majority ethnic minority)</text>
  <!-- nearly 2x annotation -->
  <line x1="240" y1="273" x2="580" y2="273" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4"/>
  <line x1="580" y1="224" x2="660" y2="224" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4"/>
  <line x1="240" y1="273" x2="660" y2="273" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4"/>
  <text x="670" y="250" fill="#e74c3c" font-size="11" font-weight="bold">Nearly 2x</text>
  <text x="670" y="265" fill="#e74c3c" font-size="11" font-weight="bold">rejection rate</text>
  <!-- bottom stats -->
  <rect x="130" y="380" width="560" height="30" fill="#e74c3c" opacity="0.08" rx="4"/>
  <text x="410" y="400" fill="#e74c3c" font-size="11" text-anchor="middle" font-weight="bold">~4,200 creditworthy applicants rejected over 2 years  |  +1.8% interest rate penalty when approved</text>
</svg>