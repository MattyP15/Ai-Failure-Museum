<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="420" fill="#f8f9fa" rx="8"/>
  <text x="400" y="28" fill="#1a1a2e" font-size="16" text-anchor="middle" font-weight="bold">Women Advancing Past CV Screening Stage</text>
  <text x="400" y="46" fill="#95a5a6" font-size="11" text-anchor="middle">Before and after AI screening tool deployment</text>
  <!-- Two big comparison blocks -->
  <rect x="80" y="70" width="280" height="250" fill="white" rx="8" stroke="#27ae60" stroke-width="2"/>
  <text x="220" y="98" fill="#27ae60" font-size="14" text-anchor="middle" font-weight="bold">Human Screening</text>
  <text x="220" y="118" fill="#95a5a6" font-size="10" text-anchor="middle">(Before AI deployment)</text>
  <!-- Pie-ish visual -->
  <circle cx="220" cy="200" r="70" fill="#eee"/>
  <circle cx="220" cy="200" r="70" fill="#8e44ad" opacity="0.3"
    stroke="#8e44ad" stroke-width="3" stroke-dasharray="149 283" stroke-dashoffset="0" transform="rotate(-90 220 200)"/>
  <text x="220" y="195" fill="#8e44ad" font-size="32" text-anchor="middle" font-weight="bold">34%</text>
  <text x="220" y="215" fill="#1a1a2e" font-size="11" text-anchor="middle">women passed screening</text>
  <rect x="440" y="70" width="280" height="250" fill="white" rx="8" stroke="#e74c3c" stroke-width="2"/>
  <text x="580" y="98" fill="#e74c3c" font-size="14" text-anchor="middle" font-weight="bold">AI Screening</text>
  <text x="580" y="118" fill="#95a5a6" font-size="10" text-anchor="middle">(After AI deployment)</text>
  <circle cx="580" cy="200" r="70" fill="#eee"/>
  <circle cx="580" cy="200" r="70" fill="#e74c3c" opacity="0.3"
    stroke="#e74c3c" stroke-width="3" stroke-dasharray="83 283" stroke-dashoffset="0" transform="rotate(-90 580 200)"/>
  <text x="580" y="195" fill="#e74c3c" font-size="32" text-anchor="middle" font-weight="bold">19%</text>
  <text x="580" y="215" fill="#1a1a2e" font-size="11" text-anchor="middle">women passed screening</text>
  <!-- Arrow between -->
  <line x1="370" y1="190" x2="430" y2="190" stroke="#e74c3c" stroke-width="3"/>
  <polygon points="430,183 445,190 430,197" fill="#e74c3c"/>
  <text x="400" y="215" fill="#e74c3c" font-size="12" text-anchor="middle" font-weight="bold">-44%</text>
  <!-- Why boxes -->
  <rect x="80" y="340" width="640" height="70" fill="white" rx="6" stroke="#ddd"/>
  <text x="400" y="360" fill="#1a1a2e" font-size="12" text-anchor="middle" font-weight="bold">Two Mechanisms Identified:</text>
  <text x="120" y="382" fill="#e74c3c" font-size="10">1. Career gaps of 6+ months penalised (disproportionately affects women / maternity leave)</text>
  <text x="120" y="400" fill="#e74c3c" font-size="10">2. Terms like "women's football", "Women in Tech" treated as negative signals (78% male training data)</text>
</svg>