<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="420" fill="#f8f9fa" rx="8"/>
  <text x="400" y="28" fill="#1a1a2e" font-size="16" text-anchor="middle" font-weight="bold">Automated Screening Pass-Through Rate by School Type</text>
  <text x="400" y="46" fill="#95a5a6" font-size="11" text-anchor="middle">After controlling for predicted grades</text>
  <!-- axes -->
  <line x1="150" y1="80" x2="150" y2="320" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="150" y1="320" x2="700" y2="320" stroke="#1a1a2e" stroke-width="2"/>
  <text x="140" y="324" fill="#1a1a2e" font-size="10" text-anchor="end">0%</text>
  <text x="140" y="260" fill="#1a1a2e" font-size="10" text-anchor="end">25%</text>
  <text x="140" y="200" fill="#1a1a2e" font-size="10" text-anchor="end">50%</text>
  <text x="140" y="140" fill="#1a1a2e" font-size="10" text-anchor="end">75%</text>
  <text x="140" y="80" fill="#1a1a2e" font-size="10" text-anchor="end">100%</text>
  <line x1="150" y1="256" x2="700" y2="256" stroke="#eee"/><line x1="150" y1="192" x2="700" y2="192" stroke="#eee"/>
  <line x1="150" y1="128" x2="700" y2="128" stroke="#eee"/><line x1="150" y1="80" x2="700" y2="80" stroke="#eee"/>
  <!-- Bars: Private=72%, Grammar=58%, State Comprehensive=30% -->
  <!-- y = 320 - (val/100)*240 -->
  <rect x="220" y="147" width="120" height="173" fill="#2980b9" rx="4" opacity="0.8"/>
  <text x="280" y="137" fill="#2980b9" font-size="16" text-anchor="middle" font-weight="bold">72%</text>
  <text x="280" y="340" fill="#1a1a2e" font-size="11" text-anchor="middle">Independent</text>
  <text x="280" y="355" fill="#95a5a6" font-size="9" text-anchor="middle">(Private school)</text>
  <rect x="390" y="181" width="120" height="139" fill="#f39c12" rx="4" opacity="0.8"/>
  <text x="450" y="171" fill="#f39c12" font-size="16" text-anchor="middle" font-weight="bold">58%</text>
  <text x="450" y="340" fill="#1a1a2e" font-size="11" text-anchor="middle">Grammar</text>
  <rect x="560" y="248" width="120" height="72" fill="#e74c3c" rx="4" opacity="0.8"/>
  <text x="620" y="238" fill="#e74c3c" font-size="16" text-anchor="middle" font-weight="bold">30%</text>
  <text x="620" y="340" fill="#1a1a2e" font-size="11" text-anchor="middle">State Comp.</text>
  <!-- 2.4x annotation -->
  <line x1="340" y1="147" x2="680" y2="147" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4"/>
  <line x1="680" y1="147" x2="680" y2="248" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4"/>
  <text x="700" y="200" fill="#e74c3c" font-size="12" font-weight="bold">2.4x</text>
  <text x="700" y="215" fill="#e74c3c" font-size="10">more likely</text>
  <!-- Extracurricular examples -->
  <rect x="50" y="370" width="330" height="45" fill="#2980b9" opacity="0.08" rx="4" stroke="#2980b9"/>
  <text x="215" y="387" fill="#2980b9" font-size="10" text-anchor="middle" font-weight="bold">High-scoring extracurriculars:</text>
  <text x="215" y="403" fill="#1a1a2e" font-size="9" text-anchor="middle">Model UN, Duke of Edinburgh, Orchestra, Rowing</text>
  <rect x="420" y="370" width="330" height="45" fill="#e74c3c" opacity="0.08" rx="4" stroke="#e74c3c"/>
  <text x="585" y="387" fill="#e74c3c" font-size="10" text-anchor="middle" font-weight="bold">Low/zero-scoring extracurriculars:</text>
  <text x="585" y="403" fill="#1a1a2e" font-size="9" text-anchor="middle">Part-time job, Caring responsibilities, Community volunteering</text>
</svg>