<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="420" fill="#f8f9fa" rx="8"/>
  <text x="400" y="30" fill="#1a1a2e" font-size="16" text-anchor="middle" font-weight="bold">Melanoma Detection Sensitivity by Fitzpatrick Skin Type</text>
  <text x="400" y="48" fill="#95a5a6" font-size="11" text-anchor="middle">Percentage of true melanomas correctly identified</text>
  <!-- axes -->
  <line x1="120" y1="70" x2="120" y2="350" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="120" y1="350" x2="750" y2="350" stroke="#1a1a2e" stroke-width="2"/>
  <!-- y labels -->
  <text x="110" y="354" fill="#1a1a2e" font-size="10" text-anchor="end">0%</text>
  <text x="110" y="284" fill="#1a1a2e" font-size="10" text-anchor="end">25%</text>
  <text x="110" y="214" fill="#1a1a2e" font-size="10" text-anchor="end">50%</text>
  <text x="110" y="144" fill="#1a1a2e" font-size="10" text-anchor="end">75%</text>
  <text x="110" y="74" fill="#1a1a2e" font-size="10" text-anchor="end">100%</text>
  <line x1="120" y1="280" x2="750" y2="280" stroke="#eee" stroke-width="1"/>
  <line x1="120" y1="210" x2="750" y2="210" stroke="#eee" stroke-width="1"/>
  <line x1="120" y1="140" x2="750" y2="140" stroke="#eee" stroke-width="1"/>
  <line x1="120" y1="70" x2="750" y2="70" stroke="#eee" stroke-width="1"/>
  <!-- bars: I=96%, II=95%, III=88%, IV=62%, V=41%, VI=34% -->
  <!-- y = 350 - (val/100)*280 -->
  <rect x="155" y="81"  width="70" height="269" fill="#fde8d0" rx="4"/>
  <rect x="260" y="84"  width="70" height="266" fill="#f0c8a0" rx="4"/>
  <rect x="365" y="104" width="70" height="246" fill="#c8a07a" rx="4"/>
  <rect x="470" y="177" width="70" height="173" fill="#a0785a" rx="4"/>
  <rect x="575" y="235" width="70" height="115" fill="#785a3c" rx="4"/>
  <rect x="680" y="255" width="70" height="95"  fill="#5a3c28" rx="4"/>
  <!-- values on bars -->
  <text x="190" y="75" fill="#27ae60" font-size="13" text-anchor="middle" font-weight="bold">96%</text>
  <text x="295" y="78" fill="#27ae60" font-size="13" text-anchor="middle" font-weight="bold">95%</text>
  <text x="400" y="98" fill="#27ae60" font-size="13" text-anchor="middle" font-weight="bold">88%</text>
  <text x="505" y="170" fill="#f39c12" font-size="13" text-anchor="middle" font-weight="bold">62%</text>
  <text x="610" y="228" fill="#e74c3c" font-size="13" text-anchor="middle" font-weight="bold">41%</text>
  <text x="715" y="248" fill="#e74c3c" font-size="13" text-anchor="middle" font-weight="bold">34%</text>
  <!-- x labels -->
  <text x="190" y="370" fill="#1a1a2e" font-size="11" text-anchor="middle">Type I</text>
  <text x="295" y="370" fill="#1a1a2e" font-size="11" text-anchor="middle">Type II</text>
  <text x="400" y="370" fill="#1a1a2e" font-size="11" text-anchor="middle">Type III</text>
  <text x="505" y="370" fill="#1a1a2e" font-size="11" text-anchor="middle">Type IV</text>
  <text x="610" y="370" fill="#1a1a2e" font-size="11" text-anchor="middle">Type V</text>
  <text x="715" y="370" fill="#1a1a2e" font-size="11" text-anchor="middle">Type VI</text>
  <text x="190" y="385" fill="#95a5a6" font-size="9" text-anchor="middle">Very light</text>
  <text x="715" y="385" fill="#95a5a6" font-size="9" text-anchor="middle">Very dark</text>
  <!-- training data annotation -->
  <rect x="145" y="395" width="300" height="18" fill="#27ae60" opacity="0.1" rx="3"/>
  <text x="295" y="408" fill="#27ae60" font-size="9" text-anchor="middle">95% of training data</text>
  <rect x="460" y="395" width="300" height="18" fill="#e74c3c" opacity="0.1" rx="3"/>
  <text x="610" y="408" fill="#e74c3c" font-size="9" text-anchor="middle">&lt;5% of training data</text>
  <!-- published accuracy line -->
  <line x1="120" y1="84" x2="750" y2="84" stroke="#27ae60" stroke-width="2" stroke-dasharray="6"/>
  <text x="752" y="80" fill="#27ae60" font-size="10">Published: "95%"</text>
</svg>