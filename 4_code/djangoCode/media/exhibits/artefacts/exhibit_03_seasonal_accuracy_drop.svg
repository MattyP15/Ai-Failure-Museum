<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="420" fill="#f8f9fa" rx="8"/>
  <text x="400" y="30" fill="#1a1a2e" font-size="16" text-anchor="middle" font-weight="bold">Species Classification Accuracy by Month — NZ Wetland Monitoring</text>
  <!-- axes -->
  <line x1="80" y1="60" x2="80" y2="360" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="80" y1="360" x2="760" y2="360" stroke="#1a1a2e" stroke-width="2"/>
  <!-- y axis labels -->
  <text x="70" y="365" fill="#1a1a2e" font-size="10" text-anchor="end">0%</text>
  <text x="70" y="305" fill="#1a1a2e" font-size="10" text-anchor="end">20%</text>
  <text x="70" y="245" fill="#1a1a2e" font-size="10" text-anchor="end">40%</text>
  <text x="70" y="185" fill="#1a1a2e" font-size="10" text-anchor="end">60%</text>
  <text x="70" y="125" fill="#1a1a2e" font-size="10" text-anchor="end">80%</text>
  <text x="70" y="65" fill="#1a1a2e" font-size="10" text-anchor="end">100%</text>
  <!-- grid lines -->
  <line x1="80" y1="300" x2="760" y2="300" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="240" x2="760" y2="240" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="180" x2="760" y2="180" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="120" x2="760" y2="120" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="60" x2="760" y2="60" stroke="#ddd" stroke-width="1"/>
  <!-- training data zone -->
  <rect x="80" y="50" width="283" height="315" fill="#27ae60" opacity="0.06"/>
  <rect x="590" y="50" width="170" height="315" fill="#27ae60" opacity="0.06"/>
  <text x="220" y="395" fill="#27ae60" font-size="10" text-anchor="middle">Training data period (Spring/Summer)</text>
  <!-- winter zone -->
  <rect x="363" y="50" width="227" height="315" fill="#e74c3c" opacity="0.06"/>
  <text x="477" y="395" fill="#e74c3c" font-size="10" text-anchor="middle">No training data (Autumn/Winter)</text>
  <!-- months -->
  <text x="137" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">Oct</text>
  <text x="194" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">Nov</text>
  <text x="250" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">Dec</text>
  <text x="307" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">Jan</text>
  <text x="363" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">Feb</text>
  <text x="420" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">Mar</text>
  <text x="477" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">Apr</text>
  <text x="533" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">May</text>
  <text x="590" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">Jun</text>
  <text x="647" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">Jul</text>
  <text x="703" y="378" fill="#1a1a2e" font-size="10" text-anchor="middle">Aug</text>
  <!-- accuracy line: Oct=91, Nov=88, Dec=85, Jan=82, Feb=75, Mar=64, Apr=58, May=55, Jun=70, Jul=85, Aug=90 -->
  <!-- y: 360 = 0%, 60 = 100%, so y = 360 - (val/100)*300 -->
  <polyline points="137,87 194,96 250,105 307,114 363,135 420,168 477,186 533,195 590,150 647,105 703,90"
    fill="none" stroke="#2980b9" stroke-width="3"/>
  <!-- dots -->
  <circle cx="137" cy="87" r="5" fill="#27ae60"/><circle cx="194" cy="96" r="5" fill="#27ae60"/>
  <circle cx="250" cy="105" r="5" fill="#27ae60"/><circle cx="307" cy="114" r="5" fill="#27ae60"/>
  <circle cx="363" cy="135" r="5" fill="#f39c12"/><circle cx="420" cy="168" r="5" fill="#e74c3c"/>
  <circle cx="477" cy="186" r="5" fill="#e74c3c"/><circle cx="533" cy="195" r="5" fill="#e74c3c"/>
  <circle cx="590" cy="150" r="5" fill="#f39c12"/><circle cx="647" cy="105" r="5" fill="#27ae60"/>
  <circle cx="703" cy="90" r="5" fill="#27ae60"/>
  <!-- annotations -->
  <text x="477" y="210" fill="#e74c3c" font-size="12" text-anchor="middle" font-weight="bold">58% — lowest accuracy</text>
  <text x="477" y="225" fill="#e74c3c" font-size="10" text-anchor="middle">73% of invasive species missed</text>
  <!-- $2.1M label -->
  <rect x="400" y="240" width="155" height="30" fill="#e74c3c" opacity="0.1" rx="4"/>
  <text x="477" y="260" fill="#e74c3c" font-size="11" text-anchor="middle" font-weight="bold">Cost: $2.1M NZD remediation</text>
  <text x="137" y="78" fill="#27ae60" font-size="11" text-anchor="middle" font-weight="bold">91%</text>
</svg>