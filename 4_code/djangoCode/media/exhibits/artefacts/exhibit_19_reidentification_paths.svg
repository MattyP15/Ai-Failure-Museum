<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="420" fill="#f8f9fa" rx="8"/>
  <text x="400" y="28" fill="#1a1a2e" font-size="16" text-anchor="middle" font-weight="bold">How "Anonymous" Footfall Data Was Used to Identify Individuals</text>
  <!-- Map area -->
  <rect x="30" y="50" width="500" height="310" fill="white" rx="6" stroke="#ddd"/>
  <text x="280" y="72" fill="#1a1a2e" font-size="12" text-anchor="middle" font-weight="bold">Town Centre Sensor Network — Device Trail #4a7f2b</text>
  <!-- Grid streets -->
  <line x1="50" y1="140" x2="510" y2="140" stroke="#ddd" stroke-width="8"/>
  <line x1="50" y1="220" x2="510" y2="220" stroke="#ddd" stroke-width="8"/>
  <line x1="50" y1="300" x2="510" y2="300" stroke="#ddd" stroke-width="8"/>
  <line x1="130" y1="80" x2="130" y2="350" stroke="#ddd" stroke-width="8"/>
  <line x1="280" y1="80" x2="280" y2="350" stroke="#ddd" stroke-width="8"/>
  <line x1="430" y1="80" x2="430" y2="350" stroke="#ddd" stroke-width="8"/>
  <!-- Sensors -->
  <circle cx="130" cy="140" r="8" fill="#2980b9" opacity="0.3"/><circle cx="280" cy="140" r="8" fill="#2980b9" opacity="0.3"/>
  <circle cx="430" cy="140" r="8" fill="#2980b9" opacity="0.3"/><circle cx="130" cy="220" r="8" fill="#2980b9" opacity="0.3"/>
  <circle cx="280" cy="220" r="8" fill="#2980b9" opacity="0.3"/><circle cx="430" cy="220" r="8" fill="#2980b9" opacity="0.3"/>
  <circle cx="130" cy="300" r="8" fill="#2980b9" opacity="0.3"/><circle cx="280" cy="300" r="8" fill="#2980b9" opacity="0.3"/>
  <!-- Movement trail -->
  <polyline points="90,310 130,300 130,220 280,220 280,140 430,140 430,220"
    fill="none" stroke="#e74c3c" stroke-width="3" stroke-dasharray="8 4"/>
  <!-- Time labels on trail -->
  <text x="80" y="325" fill="#e74c3c" font-size="8">07:45</text>
  <text x="115" y="205" fill="#e74c3c" font-size="8">07:52</text>
  <text x="265" y="205" fill="#e74c3c" font-size="8">08:01</text>
  <text x="310" y="135" fill="#e74c3c" font-size="8">08:15</text>
  <text x="440" y="135" fill="#e74c3c" font-size="8">08:30</text>
  <text x="440" y="235" fill="#e74c3c" font-size="8">17:15</text>
  <!-- Location labels -->
  <rect x="55" y="295" width="60" height="18" fill="#8e44ad" opacity="0.2" rx="3"/>
  <text x="85" y="308" fill="#8e44ad" font-size="8" text-anchor="middle">Home St.</text>
  <rect x="245" y="125" width="65" height="18" fill="#f39c12" opacity="0.2" rx="3"/>
  <text x="278" y="138" fill="#f39c12" font-size="8" text-anchor="middle">Costa Coffee</text>
  <rect x="400" y="125" width="55" height="18" fill="#00b894" opacity="0.2" rx="3"/>
  <text x="428" y="138" fill="#00b894" font-size="8" text-anchor="middle">Office</text>
  <!-- Right panel: re-identification -->
  <rect x="550" y="50" width="230" height="310" fill="white" rx="6" stroke="#e74c3c" stroke-width="2"/>
  <text x="665" y="75" fill="#e74c3c" font-size="12" text-anchor="middle" font-weight="bold">Re-Identification</text>
  <line x1="565" y1="85" x2="765" y2="85" stroke="#eee"/>
  <text x="565" y="108" fill="#1a1a2e" font-size="10" font-weight="bold">Device trail + public data:</text>
  <text x="575" y="130" fill="#1a1a2e" font-size="9">• Home street → residential records</text>
  <text x="575" y="150" fill="#1a1a2e" font-size="9">• Coffee shop 08:15 → Google review</text>
  <text x="575" y="170" fill="#1a1a2e" font-size="9">  posted at 08:20 by "Sarah M."</text>
  <text x="575" y="190" fill="#1a1a2e" font-size="9">• Office location → LinkedIn profile</text>
  <text x="575" y="210" fill="#1a1a2e" font-size="9">• Friday pub visit → Instagram post</text>
  <line x1="565" y1="225" x2="765" y2="225" stroke="#eee"/>
  <rect x="565" y="235" width="200" height="55" fill="#e74c3c" opacity="0.1" rx="4"/>
  <text x="665" y="255" fill="#e74c3c" font-size="11" text-anchor="middle" font-weight="bold">IDENTIFIED:</text>
  <text x="665" y="275" fill="#e74c3c" font-size="11" text-anchor="middle">Sarah Mitchell, 34</text>
  <text x="665" y="290" fill="#95a5a6" font-size="9" text-anchor="middle">Full daily routine reconstructed</text>
  <text x="665" y="315" fill="#1a1a2e" font-size="10" text-anchor="middle" font-weight="bold">87 / 1,000 re-identified</text>
  <text x="665" y="332" fill="#1a1a2e" font-size="9" text-anchor="middle">23 with full daily routines</text>
  <text x="665" y="348" fill="#95a5a6" font-size="9" text-anchor="middle">Using only public data</text>
  <!-- Bottom -->
  <rect x="50" y="375" width="700" height="35" fill="#e74c3c" opacity="0.08" rx="4"/>
  <text x="400" y="390" fill="#e74c3c" font-size="10" text-anchor="middle" font-weight="bold">Council claimed data was "fully anonymised" — it was pseudonymised (hashed but consistently trackable)</text>
  <text x="400" y="405" fill="#95a5a6" font-size="9" text-anchor="middle">4 spatiotemporal data points are enough to uniquely identify 95% of people (Nature, 2013)</text>
</svg>